services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: screener
      POSTGRES_USER: screener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-screener-local-only}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screener -d screener"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    environment:
      DATABASE_URL: postgres://screener:${POSTGRES_PASSWORD:-screener-local-only}@postgres:5432/screener?sslmode=disable
    command: ["/bin/sh", "-ec", "/app/migrate up && /app/migrate seed"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  app:
    build: .
    environment:
      DATABASE_URL: postgres://screener:${POSTGRES_PASSWORD:-screener-local-only}@postgres:5432/screener?sslmode=disable
      RESPONSE_ENCRYPTION_KEY: ${RESPONSE_ENCRYPTION_KEY:-c2NyZWVuZXItZGV2ZWxvcG1lbnQtb25seS1rZXktMDE=}
      HTTP_ADDR: :8080
      DB_MAX_OPEN_CONNS: "20"
      DB_MAX_IDLE_CONNS: "10"
      GOMEMLIMIT: 384MiB
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 25s
    mem_limit: 512m
    restart: unless-stopped
volumes:
  postgres_data:
