name: backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generated contract matches source
        run: |
          go generate ./...
          git diff --exit-code -- api internal/adapter/http/bridge.gen.go
      - name: Unit tests
        run: go test -race -shuffle=on ./...
      - name: Vet
        run: go vet ./...
      - name: Install pinned linter
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Standards lint
        run: golangci-lint run --build-tags integration
      - name: PostgreSQL integration tests
        run: go test -race -shuffle=on -tags integration ./...
      - name: Build binaries
        run: make build
