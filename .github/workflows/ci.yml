name: backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend dependencies
        run: npm ci --prefix web
      - name: Frontend checks
        run: |
          npm --prefix web run check
          npm --prefix web test
      - name: Generated contract matches source
        run: |
          go generate ./...
          git diff --exit-code -- api internal/adapter/http/bridge.gen.go
      - name: Unit tests
        run: go test -race -shuffle=on ./...
      - name: Vet
        run: go vet ./...
      - name: Install pinned linter
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Standards lint
        run: golangci-lint run --build-tags integration
      - name: PostgreSQL integration tests
        run: go test -race -shuffle=on -tags integration ./...
      - name: Build binaries
        run: make build
      - name: Frontend against deployed API
        run: |
          HTTP_PORT=18081 docker compose up --build --wait -d
          SCREENER_URL=http://127.0.0.1:18081 npm --prefix web run test:live
      - name: Stop frontend test deployment
        if: always()
        run: docker compose down
