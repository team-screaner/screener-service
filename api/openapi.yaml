{
  "openapi": "3.0.3",
  "info": {
    "title": "Screener API",
    "version": "0.1.0",
    "description": "Bearer sessions and scoped agent tokens. Score 0..4. Cursor lists are keyset ordered by stable ID and bound to user/path/filters. Every command except login/logout requires Idempotency-Key; identical canonical JSON replays within same principal+method+path, changed payload returns 422. Evidence acceptance never changes assessment. XLSX export returns application/vnd.openxmlformats-officedocument.spreadsheetml.sheet."
  },
